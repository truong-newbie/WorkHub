spring.application.name=WorkHub
spring.profiles.active=dev

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

search.job.index-name=workhub_jobs
search.job.fuzzy-enabled=true
search.job.autocomplete-limit=10
search.job.fallback-to-jpa=true

recommendation.weights.content=0.50
recommendation.weights.behavior=0.30
recommendation.weights.collaborative=0.20
recommendation.behavior.view-weight=1
recommendation.behavior.click-weight=3
recommendation.behavior.save-weight=5
recommendation.behavior.apply-weight=10
recommendation.behavior.search-keyword-weight=2
recommendation.behavior.history-days=30
recommendation.collaborative.similar-user-limit=20
recommendation.collaborative.min-similarity=0.25
recommendation.result.max-candidates=200
recommendation.result.default-page-size=10
