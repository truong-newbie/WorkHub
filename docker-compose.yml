services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      - MYSQL_DATABASE=testdb
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
    networks:
      - default
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: workhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    container_name: workhub-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - default

  ai-worker:
    container_name: ai-worker
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AI_WORKER_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - AI_WORKER_MAX_TEXT_LENGTH=8000
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30}
      - GEMINI_MAX_TEXT_LENGTH=${GEMINI_MAX_TEXT_LENGTH:-12000}
    volumes:
      - ai_worker_model_cache:/root/.cache/huggingface
    networks:
      - default

  backend-service:
    container_name: backend-service
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AI_WORKER_BASE_URL=http://ai-worker:8000
      - AI_WORKER_MOCK_ENABLED=false
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      - mysql
      - ai-worker
      - elasticsearch
      - rabbitmq
    networks:
      - default

networks:
  default:
    name: backend-service

volumes:
  mysql_data:
  elasticsearch_data:
  ai_worker_model_cache:
